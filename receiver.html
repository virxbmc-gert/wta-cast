<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WTA TV Custom Receiver</title>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: linear-gradient(220.67deg, #00f0c8, #00cd5a 70%);
      overflow: hidden;
      font-family: sans-serif;
    }

    cast-media-player {
  --theme-hue: 280;
  --progress-color: #FFD700;
  --splash-image: url(' ');
  --splash-size: 260px;
  --logo-image: url('logo_wta.png');
  --background-image: linear-gradient(220.67deg, #00f0c8, #00cd5a 70%);
}

    body.anti-spoiler cast-media-player {
      --progress-color: transparent !important;
    }
  </style>
</head>
<body>
  <cast-media-player id="caf-player"></cast-media-player>

  <script>
    const CUSTOM_NS = 'urn:x-cast:com.unofficial.wtatv';
    let isAntiSpoilerActive = true;

    const ANTI_SPOILER_CSS = `
      .progressBar, .currentTime, .duration, .remainingTime,
      .controls-progress, .player-controls-progress,
      [class*="time"], [class*="Time"], [class*="progress"], [class*="Progress"],
      [class*="scrubber"], [class*="Scrubber"], [class*="seek"], [class*="Seek"],
      [id*="time"], [id*="Time"], [id*="progress"], [id*="Progress"],
      #progressBar, #currentTime, #duration, touch-controls {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }
    `;

    // Recursively traverses light DOM and all open Shadow DOMs
    function applyAntiSpoilerToRoot(root) {
      if (!root) return;

      // 1. Inject style block into every ShadowRoot we encounter
      if (root instanceof ShadowRoot || root === document.head) {
        let style = root.querySelector ? root.querySelector('#anti-spoiler-shadow-style') : null;
        if (!style) {
          style = document.createElement('style');
          style.id = 'anti-spoiler-shadow-style';
          root.appendChild(style);
        }
        style.textContent = isAntiSpoilerActive ? ANTI_SPOILER_CSS : '';
      }

      // 2. Scan all elements inside this root
      const elements = root.querySelectorAll ? root.querySelectorAll('*') : [];
      elements.forEach(el => {
        // Recurse into nested shadow roots (e.g., <touch-controls> inside <cast-media-player>)
        if (el.shadowRoot) {
          applyAntiSpoilerToRoot(el.shadowRoot);
        }

        const tag = el.tagName ? el.tagName.toLowerCase() : '';
        if (tag === 'video' || tag === 'cast-media-player') return;

        // Check if this leaf element displays a timestamp (e.g. "01:24:10" or "45:12")
        if (el.children.length === 0 && el.textContent && /\d+:\d{2}/.test(el.textContent)) {
          if (isAntiSpoilerActive) {
            el.style.setProperty('display', 'none', 'important');
            el.style.setProperty('visibility', 'hidden', 'important');
            el.style.setProperty('opacity', '0', 'important');
          } else {
            el.style.removeProperty('display');
            el.style.removeProperty('visibility');
            el.style.removeProperty('opacity');
          }
        }
      });
    }

    function enforceTvAntiSpoiler() {
      const player = document.getElementById('caf-player');
      if (!player) return;

      if (isAntiSpoilerActive) {
        document.body.classList.add('anti-spoiler');
      } else {
        document.body.classList.remove('anti-spoiler');
      }

      applyAntiSpoilerToRoot(document.head);
      applyAntiSpoilerToRoot(player);
      if (player.shadowRoot) {
        applyAntiSpoilerToRoot(player.shadowRoot);
      }
    }

    function setAntiSpoiler(enable) {
      isAntiSpoilerActive = Boolean(enable);
      enforceTvAntiSpoiler();
    }

    // Run every 250ms so seeking/pausing never flashes the duration
    setInterval(enforceTvAntiSpoiler, 250);

    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();

    playerManager.setMessageInterceptor(
      cast.framework.messages.MessageType.LOAD,
      loadRequestData => {
        if (loadRequestData && loadRequestData.customData && typeof loadRequestData.customData.antiSpoiler !== 'undefined') {
          setAntiSpoiler(Boolean(loadRequestData.customData.antiSpoiler));
        }
        // Strip metadata duration when anti-spoiler is active
        if (isAntiSpoilerActive && loadRequestData && loadRequestData.media) {
          delete loadRequestData.media.duration;
        }
        return loadRequestData;
      }
    );
    playerManager.setMessageInterceptor(
      cast.framework.messages.MessageType.MEDIA_STATUS,
      status => {
        if (isAntiSpoilerActive && status && status.media) {
          status.media.duration = null;
        }
        return status;
      }
    );

    // Intercept SEEK and PAUSE so the HUD is scrubbed the instant it wakes up
    [
      cast.framework.events.EventType.PLAYING,
      cast.framework.events.EventType.PAUSE,
      cast.framework.events.EventType.SEEKING,
      cast.framework.events.EventType.SEEKED,
      cast.framework.events.EventType.TIME_UPDATE
    ].forEach(evt => {
      playerManager.addEventListener(evt, () => enforceTvAntiSpoiler());
    });

    context.addCustomMessageListener(CUSTOM_NS, event => {
      try {
        const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
        if (data && typeof data.antiSpoiler !== 'undefined') {
          setAntiSpoiler(Boolean(data.antiSpoiler));
        }
      } catch (e) {}
    });

    const options = new cast.framework.CastReceiverOptions();
    options.customNamespaces = {
      [CUSTOM_NS]: cast.framework.system.MessageType.JSON
    };
    options.disableIdleTimeout = true;

    context.start(options);
  </script>
</body>
</html>
