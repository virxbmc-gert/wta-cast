<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WTA TV Custom Receiver</title>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0d0d0d;
      overflow: hidden;
      font-family: sans-serif;
    }

    #legacy-video {
      width: 100%;
      height: 100%;
      display: none;
      background: #000;
    }

    cast-media-player {
      --theme-hue: 280;
      --progress-color: #FFD700;
      --splash-image: url('https://www.wtatv.com/assets/images/logo.png');
      --splash-size: 260px;
      --background-image: none;
    }

    body.anti-spoiler cast-media-player {
      --progress-color: transparent !important;
    }
  </style>
</head>
<body>
 <p style="color: #00FF00; font-size: 32px; position: fixed; top: 20px; left: 20px; z-index: 99999; margin: 0;">
  Custom Receiver Loaded
</p>
  <cast-media-player id="caf-player"></cast-media-player>

  <script>
    const CUSTOM_NS = 'urn:x-cast:com.unofficial.wtatv';
    let isAntiSpoilerActive = true;

    function enforceTvAntiSpoiler() {
      const player = document.getElementById('caf-player');
      if (!player) return;

      if (isAntiSpoilerActive) {
        document.body.classList.add('anti-spoiler');
      } else {
        document.body.classList.remove('anti-spoiler');
      }

      // 1. Inject style block into open Shadow DOM if accessible
      if (player.shadowRoot) {
        let style = player.shadowRoot.getElementById('anti-spoiler-shadow-style');
        if (!style) {
          style = document.createElement('style');
          style.id = 'anti-spoiler-shadow-style';
          player.shadowRoot.appendChild(style);
        }
        style.textContent = isAntiSpoilerActive ? `
          .progressBar, .currentTime, .duration, .remainingTime,
          [class*="time"], [class*="Time"], [class*="progress"], [class*="Progress"],
          [class*="scrubber"], [class*="Scrubber"], [class*="seek"], [class*="Seek"],
          #progressBar, #currentTime, #duration, # controls {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
          }
        ` : '';
      }

      // 2. Keep the video element visible while hiding surrounding HUD overlays
      const roots = [player, player.shadowRoot].filter(Boolean);
      roots.forEach(root => {
        const allEls = root.querySelectorAll('*');
        allEls.forEach(el => {
          const tag = el.tagName ? el.tagName.toLowerCase() : '';
          if (tag === 'video') {
            el.style.cssText = 'visibility: visible !important; opacity: 1 !important; display: block !important; width: 100vw !important; height: 100vh !important; position: fixed !important; top: 0 !important; left: 0 !important; z-index: 9999 !important; background: #000 !important;';
          } else if (!el.querySelector || !el.querySelector('video')) {
            if (isAntiSpoilerActive) {
              el.style.setProperty('opacity', '0', 'important');
              el.style.setProperty('visibility', 'hidden', 'important');
            } else {
              el.style.removeProperty('opacity');
              el.style.removeProperty('visibility');
            }
          }
        });
      });
    }

    function setAntiSpoiler(enable) {
      isAntiSpoilerActive = Boolean(enable);
      enforceTvAntiSpoiler();
    }

    // Continuously enforce every 500ms so seeking/pausing doesn't flash the duration
    setInterval(enforceTvAntiSpoiler, 500);

    function bootCafV3() {
      const context = cast.framework.CastReceiverContext.getInstance();
      const playerManager = context.getPlayerManager();

      playerManager.setMessageInterceptor(
        cast.framework.messages.MessageType.LOAD,
        loadRequestData => {
          if (loadRequestData && loadRequestData.customData && typeof loadRequestData.customData.antiSpoiler !== 'undefined') {
            setAntiSpoiler(Boolean(loadRequestData.customData.antiSpoiler));
          }
          return loadRequestData;
        }
      );

      playerManager.addEventListener(
        cast.framework.events.EventType.PLAYING,
        () => {
          enforceTvAntiSpoiler();
        }
      );

      context.addCustomMessageListener(CUSTOM_NS, event => {
        try {
          const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
          if (data && typeof data.antiSpoiler !== 'undefined') {
            setAntiSpoiler(Boolean(data.antiSpoiler));
          }
        } catch (e) {}
      });

      const options = new cast.framework.CastReceiverOptions();
      options.customNamespaces = Object.assign({});
      options.customNamespaces[CUSTOM_NS] = cast.framework.system.MessageType.JSON;
      options.disableIdleTimeout = true;

      context.start(options);
    }

    let attempts = 0;
    const waitTimer = setInterval(() => {
      attempts++;
      if (window.cast && window.cast.framework && window.cast.framework.CastReceiverContext) {
        clearInterval(waitTimer);
        bootCafV3();
      } else if (window.cast && window.cast.receiver && window.cast.receiver.CastReceiverManager && attempts > 15) {
        clearInterval(waitTimer);
        bootReceiverV2();
      } else if (attempts > 80) {
        clearInterval(waitTimer);
      }
    }, 100);
  </script>
</body>
</html>
